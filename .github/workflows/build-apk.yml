name: Build Mido Telegram APK

on:
  push:
    branches:
      - feature/mido-settings
      - main
      - master
  workflow_dispatch:
    inputs:
      variant:
        description: 'APK Build Variant'
        required: true
        default: 'afatStandalone'
        type: choice
        options:
          - afatStandalone
          - afatRelease
          - afatDebug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install native build tools (nasm, yasm, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm ninja-build

      - name: Install Android SDK 36, NDK 27.2.12479018 & CMake 3.22.1
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Mido Telegram APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'afatStandalone' }}
        run: |
          chmod +x ./gradlew
          case "$VARIANT" in
            afatStandalone) TASK="assembleAfatStandalone" ;;
            afatRelease)    TASK="assembleAfatRelease" ;;
            afatDebug)      TASK="assembleAfatDebug" ;;
            *)              TASK="assembleAfatStandalone" ;;
          esac
          set +e
          ./gradlew ":TMessagesProj_App:${TASK}" --no-daemon --console=plain --stacktrace --max-workers=2 > build.log 2>&1
          EXIT_CODE=$?
          set -e
          tail -n 120 build.log
          if [ $EXIT_CODE -ne 0 ]; then
            python3 -c '
          with open("build.log", errors="ignore") as f:
              lines = f.read().splitlines()
          err = [l for l in lines if any(k in l for k in ["FAILURE:", "error:", "Exception", "Execution failed", "Caused by:", "What went wrong"])]
          for l in (err[:10] if err else lines[-15:]):
              print("::error::" + l[:300])
          '
            exit $EXIT_CODE
          fi

      - name: Locate generated APK
        run: |
          mkdir -p apk-output
          find TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/Mido-Telegram.apk \;
          ls -lh apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mido-Telegram-${{ github.event.inputs.variant || 'afatStandalone' }}-APK
          path: apk-output/*.apk
          retention-days: 30
